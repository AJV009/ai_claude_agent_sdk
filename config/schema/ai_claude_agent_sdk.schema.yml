ai_claude_agent_sdk.settings:
  type: config_object
  label: 'AI Claude Agent SDK settings'
  mapping:
    cli_path:
      type: string
      label: 'Claude CLI path'
    default_model:
      type: string
      label: 'Default model'
    working_directory:
      type: string
      label: 'Working directory'
    max_concurrent_cli:
      type: integer
      label: 'Max concurrent Claude CLI processes'
    api_key_source:
      type: string
      label: 'API key source'
    api_key_key:
      type: string
      label: 'Key module API key entity ID'
    api_key_env_var:
      type: string
      label: 'Environment variable name for API key'
    sidecar_url:
      type: string
      label: 'Sidecar URL'
    sidecar_ws_url:
      type: string
      label: 'Sidecar WebSocket URL'
    permission_timeout:
      type: integer
      label: 'Permission timeout (seconds)'

ai_claude_agent_sdk.agent_profile.*:
  type: config_entity
  label: 'Claude Agent Profile'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    uuid:
      type: string
      label: 'UUID'
    description:
      type: string
      label: 'Description'
    system_prompt:
      type: text
      label: 'System prompt'
    model:
      type: string
      label: 'Model'
    permission_mode:
      type: string
      label: 'Permission mode'
    max_turns:
      type: integer
      label: 'Max turns'
    allowed_tools:
      type: sequence
      label: 'Allowed tools'
      sequence:
        type: string
        label: 'Tool name'
    denied_tools:
      type: sequence
      label: 'Denied tools'
      sequence:
        type: string
        label: 'Tool name'
    mcp_servers:
      type: sequence
      label: 'MCP servers'
      sequence:
        type: mapping
        label: 'MCP server'
        mapping:
          name:
            type: string
            label: 'Name'
          transport:
            type: string
            label: 'Transport'
          url:
            type: string
            label: 'URL'
    working_directory:
      type: string
      label: 'Working directory'
    sandbox:
      type: boolean
      label: 'Sandbox'
    allowed_directories:
      type: sequence
      label: 'Allowed directories'
      sequence:
        type: string
        label: 'Directory path'
    executor_uid:
      type: integer
      label: 'Executor UID'
    execution_modality:
      type: string
      label: 'Execution modality'
    extra_args:
      type: sequence
      label: 'Extra CLI arguments'
      sequence:
        type: string
        label: 'Argument'

ai_claude_agent_sdk.scheduled_task.*:
  type: config_entity
  label: 'Scheduled Task'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    uuid:
      type: string
      label: 'UUID'
    status:
      type: boolean
      label: 'Enabled'
    source_type:
      type: string
      label: 'Source type'
    skill_id:
      type: string
      label: 'Skill ID'
    prompt:
      type: text
      label: 'Custom prompt'
    arguments:
      type: string
      label: 'Arguments'
    profile_id:
      type: string
      label: 'Profile ID'
    schedule_date:
      type: string
      label: 'Schedule date/time'
    schedule_type:
      type: string
      label: 'Schedule repeat type'
    schedule_custom_interval:
      type: integer
      label: 'Custom interval (seconds)'

ai_claude_agent_sdk.agent_skill.*:
  type: config_entity
  label: 'Agent Skill'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    uuid:
      type: string
      label: 'UUID'
    description:
      type: string
      label: 'Description'
    skill_body:
      type: text
      label: 'SKILL.md body content'
    disable_model_invocation:
      type: boolean
      label: 'Disable model invocation'
    user_invocable:
      type: boolean
      label: 'User invocable'
    argument_hint:
      type: string
      label: 'Argument hint'
    allowed_tools:
      type: sequence
      label: 'Allowed tools'
      sequence:
        type: string
        label: 'Tool name'
    context_mode:
      type: string
      label: 'Context mode'
    agent_type:
      type: string
      label: 'Subagent type'
