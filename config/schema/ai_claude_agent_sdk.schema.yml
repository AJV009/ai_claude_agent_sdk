ai_claude_agent_sdk.settings:
  type: config_object
  label: 'AI Claude Agent SDK settings'
  mapping:
    cli_path:
      type: string
      label: 'Claude CLI path'
    default_model:
      type: string
      label: 'Default model'
    working_directory:
      type: string
      label: 'Working directory'
    max_concurrent_cli:
      type: integer
      label: 'Max concurrent Claude CLI processes'
    api_key_source:
      type: string
      label: 'API key source'
    api_key_key:
      type: string
      label: 'Key module API key entity ID'
    api_key_env_var:
      type: string
      label: 'Environment variable name for API key'
