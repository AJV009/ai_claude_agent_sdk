ai_claude_agent_sdk.admin:
  path: '/admin/config/ai/claude-agent-sdk'
  defaults:
    _title: 'Claude Agent SDK'
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
  requirements:
    _permission: 'administer claude agent sdk'
  options:
    _admin_route: TRUE

ai_claude_agent_sdk.settings:
  path: '/admin/config/ai/claude-agent-sdk/settings'
  defaults:
    _title: 'Settings'
    _form: '\Drupal\ai_claude_agent_sdk\Form\ClaudeAgentSdkSettingsForm'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_profile.collection:
  path: '/admin/config/ai/claude-agent-sdk/profiles'
  defaults:
    _title: 'Agent Profiles'
    _entity_list: 'agent_profile'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_profile.add_form:
  path: '/admin/config/ai/claude-agent-sdk/profiles/add'
  defaults:
    _title: 'Add agent profile'
    _entity_form: 'agent_profile.add'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_profile.edit_form:
  path: '/admin/config/ai/claude-agent-sdk/profiles/{agent_profile}/edit'
  defaults:
    _title: 'Edit agent profile'
    _entity_form: 'agent_profile.edit'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_profile.delete_form:
  path: '/admin/config/ai/claude-agent-sdk/profiles/{agent_profile}/delete'
  defaults:
    _title: 'Delete agent profile'
    _entity_form: 'agent_profile.delete'
  requirements:
    _permission: 'administer claude agent sdk'

ai_claude_agent_sdk.terminal:
  path: '/admin/config/ai/claude-agent-sdk/terminal'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk\Controller\ClaudeTerminalController::page'
    _title: 'Claude Terminal'
  requirements:
    _permission: 'use claude terminal'

ai_claude_agent_sdk.assistant_stream:
  path: '/api/claude-assistant/stream'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk\Controller\ClaudeAssistantController::stream'
  requirements:
    _permission: 'use claude terminal'
  options:
    no_cache: TRUE

ai_claude_agent_sdk.assistant_permission_response:
  path: '/api/claude-assistant/permission-response'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk\Controller\ClaudeAssistantController::permissionResponse'
  requirements:
    _permission: 'use claude terminal'
  methods: [POST]
  options:
    no_cache: TRUE

entity.agent_skill.collection:
  path: '/admin/config/ai/claude-agent-sdk/skills'
  defaults:
    _title: 'Agent Skills'
    _entity_list: 'agent_skill'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_skill.add_form:
  path: '/admin/config/ai/claude-agent-sdk/skills/add'
  defaults:
    _title: 'Add agent skill'
    _entity_form: 'agent_skill.add'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_skill.edit_form:
  path: '/admin/config/ai/claude-agent-sdk/skills/{agent_skill}/edit'
  defaults:
    _title: 'Edit agent skill'
    _entity_form: 'agent_skill.edit'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_skill.delete_form:
  path: '/admin/config/ai/claude-agent-sdk/skills/{agent_skill}/delete'
  defaults:
    _title: 'Delete agent skill'
    _entity_form: 'agent_skill.delete'
  requirements:
    _permission: 'administer claude agent sdk'

ai_claude_agent_sdk.skills_upload:
  path: '/admin/config/ai/claude-agent-sdk/skills/upload'
  defaults:
    _title: 'Upload skill'
    _form: '\Drupal\ai_claude_agent_sdk\Form\AgentSkillUploadForm'
  requirements:
    _permission: 'administer claude agent sdk'

ai_claude_agent_sdk.skills_sync:
  path: '/admin/config/ai/claude-agent-sdk/skills/sync'
  defaults:
    _title: 'Sync skills from filesystem'
    _form: '\Drupal\ai_claude_agent_sdk\Form\AgentSkillSyncForm'
  requirements:
    _permission: 'administer claude agent sdk'

ai_claude_agent_sdk.skill_run:
  path: '/admin/config/ai/claude-agent-sdk/skills/{agent_skill}/run'
  defaults:
    _form: '\Drupal\ai_claude_agent_sdk\Form\AgentSkillRunForm'
    _title: 'Run Skill'
  requirements:
    _permission: 'use claude terminal'
  options:
    parameters:
      agent_skill:
        type: entity:agent_skill

ai_claude_agent_sdk.sessions:
  path: '/admin/config/ai/claude-agent-sdk/sessions'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk\Controller\ClaudeSessionsController::page'
    _title: 'Claude Sessions'
  requirements:
    _permission: 'use claude terminal'

ai_claude_agent_sdk.session_messages:
  path: '/admin/config/ai/claude-agent-sdk/sessions/{session_id}/messages'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk\Controller\ClaudeSessionsController::messages'
    _title: 'Session Messages'
  requirements:
    _permission: 'use claude terminal'
  options:
    no_cache: TRUE

entity.scheduled_task.collection:
  path: '/admin/config/ai/claude-agent-sdk/scheduled-tasks'
  defaults:
    _title: 'Scheduled Tasks'
    _entity_list: 'scheduled_task'
  requirements:
    _permission: 'administer claude agent sdk'

entity.scheduled_task.add_form:
  path: '/admin/config/ai/claude-agent-sdk/scheduled-tasks/add'
  defaults:
    _title: 'Add scheduled task'
    _entity_form: 'scheduled_task.add'
  requirements:
    _permission: 'administer claude agent sdk'

entity.scheduled_task.edit_form:
  path: '/admin/config/ai/claude-agent-sdk/scheduled-tasks/{scheduled_task}/edit'
  defaults:
    _title: 'Edit scheduled task'
    _entity_form: 'scheduled_task.edit'
  requirements:
    _permission: 'administer claude agent sdk'

entity.scheduled_task.delete_form:
  path: '/admin/config/ai/claude-agent-sdk/scheduled-tasks/{scheduled_task}/delete'
  defaults:
    _title: 'Delete scheduled task'
    _entity_form: 'scheduled_task.delete'
  requirements:
    _permission: 'administer claude agent sdk'

ai_claude_agent_sdk.policy_evaluate:
  path: '/api/claude-policy/evaluate'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk\Controller\ClaudePolicyController::evaluate'
  requirements:
    # Authentication is handled by HMAC token validation in the controller.
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE

ai_claude_agent_sdk.query_abort:
  path: '/admin/config/ai/claude-agent-sdk/queries/{query_id}/abort'
  defaults:
    _form: '\Drupal\ai_claude_agent_sdk\Form\QueryAbortConfirmForm'
    _title: 'Interrupt Query'
  requirements:
    _permission: 'use claude terminal'

ai_claude_agent_sdk.executor_autocomplete:
  path: '/admin/config/ai/claude-agent-sdk/autocomplete/executor'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk\Controller\ExecutorAutocompleteController::handleAutocomplete'
  requirements:
    _permission: 'administer claude agent sdk'
