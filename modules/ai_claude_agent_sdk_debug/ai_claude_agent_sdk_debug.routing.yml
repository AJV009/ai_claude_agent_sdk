ai_claude_agent_sdk_debug.page:
  path: '/admin/config/ai/claude-agent-sdk/debug'
  defaults:
    _title: 'Debug'
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugController::page'
    mode: 'client'
  requirements:
    _permission: 'access claude agent sdk debug'
  options:
    _admin_route: TRUE

ai_claude_agent_sdk_debug.query:
  path: '/admin/config/ai/claude-agent-sdk/debug/query'
  defaults:
    _title: 'Debug'
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugController::page'
    mode: 'query'
  requirements:
    _permission: 'access claude agent sdk debug'
  options:
    _admin_route: TRUE

ai_claude_agent_sdk_debug.session_query:
  path: '/admin/config/ai/claude-agent-sdk/debug/session-query'
  defaults:
    _title: 'Debug'
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugController::page'
    mode: 'session_query'
  requirements:
    _permission: 'access claude agent sdk debug'
  options:
    _admin_route: TRUE

ai_claude_agent_sdk_debug.terminal:
  path: '/admin/config/ai/claude-agent-sdk/debug/terminal'
  defaults:
    _title: 'Debug'
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugController::page'
    mode: 'terminal'
  requirements:
    _permission: 'access claude agent sdk debug'
  options:
    _admin_route: TRUE

ai_claude_agent_sdk_debug.processes:
  path: '/admin/config/ai/claude-agent-sdk/debug/processes'
  defaults:
    _title: 'Claude Agent SDK Processes'
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugProcessController::page'
  requirements:
    _permission: 'access claude agent sdk debug'
  options:
    _admin_route: TRUE

ai_claude_agent_sdk_debug.processes_data:
  path: '/admin/config/ai/claude-agent-sdk/debug/processes/data'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugProcessController::data'
  requirements:
    _permission: 'access claude agent sdk debug'
  options:
    _admin_route: TRUE

ai_claude_agent_sdk_debug.session_view:
  path: '/admin/config/ai/claude-agent-sdk/debug/session/{session_id}'
  defaults:
    _title: 'Claude Session'
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugSessionController::page'
  requirements:
    _permission: 'access claude agent sdk debug'
    session_id: '[A-Za-z0-9-]+'
  options:
    _admin_route: TRUE

ai_claude_agent_sdk_debug.session_delete_confirm:
  path: '/admin/config/ai/claude-agent-sdk/debug/session/{session_id}/delete'
  defaults:
    _title: 'Delete session'
    _form: '\Drupal\ai_claude_agent_sdk_debug\Form\ClaudeAgentSdkDebugSessionDeleteForm'
  requirements:
    _permission: 'access claude agent sdk debug'
    session_id: '[A-Za-z0-9-]+'
  options:
    _admin_route: TRUE

ai_claude_agent_sdk_debug.processes_kill:
  path: '/admin/config/ai/claude-agent-sdk/debug/processes/kill'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugProcessController::kill'
  requirements:
    _permission: 'access claude agent sdk debug'
  options:
    _admin_route: TRUE
    _csrf_token: TRUE

ai_claude_agent_sdk_debug.stream:
  path: '/admin/config/ai/claude-agent-sdk/debug/stream'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugStreamController::stream'
  requirements:
    _permission: 'access claude agent sdk debug'

ai_claude_agent_sdk_debug.permission_decision:
  path: '/admin/config/ai/claude-agent-sdk/debug/permission-decision'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugStreamController::permissionResponse'
  requirements:
    _permission: 'access claude agent sdk debug'

ai_claude_agent_sdk_debug.permission_response:
  path: '/admin/config/ai/claude-agent-sdk/debug/permission-response'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk_debug\Controller\ClaudeAgentSdkDebugStreamController::permissionResponse'
  requirements:
    _permission: 'access claude agent sdk debug'
