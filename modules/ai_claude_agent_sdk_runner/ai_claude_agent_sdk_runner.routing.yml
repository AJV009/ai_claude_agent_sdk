entity.agent_runner_skill.collection:
  path: '/admin/config/ai/claude-agent-sdk/runner-skills'
  defaults:
    _entity_list: 'agent_runner_skill'
    _title: 'Agent Runner Skills'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_runner_skill.edit_form:
  path: '/admin/config/ai/claude-agent-sdk/runner-skills/{agent_runner_skill}/edit'
  defaults:
    _entity_form: 'agent_runner_skill.edit'
    _title: 'Edit Runner Skill'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_runner_skill.delete_form:
  path: '/admin/config/ai/claude-agent-sdk/runner-skills/{agent_runner_skill}/delete'
  defaults:
    _entity_form: 'agent_runner_skill.delete'
    _title: 'Delete Runner Skill'
  requirements:
    _permission: 'administer claude agent sdk'

ai_claude_agent_sdk_runner.webhook:
  path: '/api/claude-runner/webhook'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk_runner\Controller\ClaudeRunnerWebhookController::receive'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE

ai_claude_agent_sdk_runner.poll:
  path: '/api/claude-runner/poll/{queryId}'
  defaults:
    _controller: 'ai_claude_agent_sdk_runner.poll_controller:poll'
  methods: [GET]
  requirements:
    _permission: 'access deepchat api'
  options:
    no_cache: TRUE

ai_claude_agent_sdk_runner.permission_response:
  path: '/api/claude-runner/permission-response'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk_runner\Controller\PermissionResponseController::respond'
  requirements:
    _permission: 'access deepchat api'
  methods: [POST]
  options:
    no_cache: TRUE
