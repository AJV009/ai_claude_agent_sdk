entity.agent_runner_skill.collection:
  path: '/admin/config/ai/claude-agent-sdk/runner-skills'
  defaults:
    _entity_list: 'agent_runner_skill'
    _title: 'Agent Runner Skills'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_runner_skill.edit_form:
  path: '/admin/config/ai/claude-agent-sdk/runner-skills/{agent_runner_skill}/edit'
  defaults:
    _entity_form: 'agent_runner_skill.edit'
    _title: 'Edit Runner Skill'
  requirements:
    _permission: 'administer claude agent sdk'

entity.agent_runner_skill.delete_form:
  path: '/admin/config/ai/claude-agent-sdk/runner-skills/{agent_runner_skill}/delete'
  defaults:
    _entity_form: 'agent_runner_skill.delete'
    _title: 'Delete Runner Skill'
  requirements:
    _permission: 'administer claude agent sdk'
