ai_claude_agent_sdk_assistant.webhook:
  path: '/api/claude-runner/webhook'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk_assistant\Controller\AssistantWebhookController::receive'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE

ai_claude_agent_sdk_assistant.poll:
  path: '/api/claude-runner/poll/{queryId}'
  defaults:
    _controller: 'ai_claude_agent_sdk_assistant.poll_controller:poll'
  methods: [GET]
  requirements:
    _permission: 'access deepchat api'
  options:
    no_cache: TRUE

ai_claude_agent_sdk_assistant.abort:
  path: '/api/claude-runner/abort/{queryId}'
  defaults:
    _controller: 'ai_claude_agent_sdk_assistant.poll_controller:abort'
  requirements:
    _permission: 'access deepchat api'
  methods: [POST]
  options:
    no_cache: TRUE

ai_claude_agent_sdk_assistant.permission_response:
  path: '/api/claude-runner/permission-response'
  defaults:
    _controller: '\Drupal\ai_claude_agent_sdk_assistant\Controller\AssistantPermissionResponseController::respond'
  requirements:
    _permission: 'access deepchat api'
  methods: [POST]
  options:
    no_cache: TRUE
